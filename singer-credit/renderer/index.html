<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>SINGER CREDIT - Loan Management</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside id="side">
  <div class="brand"><span class="logo">S</span><div><b>SINGER CREDIT</b><small>Loan Model &amp; Management</small></div></div>
  <nav id="nav"></nav>
</aside>
<main>
  <header id="top">
    <div class="clock"><span>System date</span><b id="clock">-</b></div>
    <div class="sim">
      <span>Simulate time</span>
      <button data-act="advance" data-days="1">+1 day</button>
      <button data-act="advance" data-days="7">+7 days</button>
      <button data-act="advance" data-days="30">+30 days</button>
    </div>
    <div class="lang" id="langSwitch"></div>
    <button class="btn ghost sm" data-act="reset">Reset data</button>
  </header>
  <div id="toast"></div>
  <section id="view"></section>
</main>
<div id="modal" hidden></div>
<script src="app.js"></script>
</body>
</html>
