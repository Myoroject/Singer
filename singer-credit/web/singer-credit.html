<title>SINGER CREDIT</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#171a20;--ink2:#4a5261;--mute:#7a8393;--line:#e8eaee;--soft:#f1f3f6;--accent:#d5001c;--accent-ink:#fff;--side:#15181e;--ok:#14763a;--warn:#a65f00;--bad:#b42318;--info:#1c5bc4;--okbg:#e7f5ec;--warnbg:#fcf0d9;--badbg:#fde9e6;--infobg:#e8effc;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#171a20;--ink:#eef0f4;--ink2:#b5bcc8;--mute:#8b94a3;--line:#262b34;--soft:#1e222a;--side:#090a0d;--okbg:#10301c;--warnbg:#3a2a0a;--badbg:#3b1511;--infobg:#12294d;--ok:#5fd28a;--warn:#f0b24a;--bad:#ff8a7d;--info:#8bb6ff}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#171a20;--ink:#eef0f4;--ink2:#b5bcc8;--mute:#8b94a3;--line:#262b34;--soft:#1e222a;--side:#090a0d;--okbg:#10301c;--warnbg:#3a2a0a;--badbg:#3b1511;--infobg:#12294d;--ok:#5fd28a;--warn:#f0b24a;--bad:#ff8a7d;--info:#8bb6ff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter",-apple-system,"Segoe UI",Roboto,"Noto Sans Sinhala","Noto Sans Tamil",sans-serif}
button{font:inherit;cursor:pointer}
/* sidebar: SINGER red */
#side{width:248px;background:linear-gradient(180deg,#d9001b 0%,#b80017 100%);color:#fff;display:flex;flex-direction:column;padding:26px 14px 18px;flex:none}
.brand{text-align:center;padding:4px 0 28px;border-bottom:1px solid #ffffff30;margin:0 6px 20px}
.logo-word{font-weight:800;font-size:30px;letter-spacing:.34em;padding-left:.34em;line-height:1;color:#fff}
.brand-sub{margin-top:10px;font-size:12px;letter-spacing:.5em;padding-left:.5em;font-weight:600;color:#ffd9de}
#nav{flex:1}
#nav button{display:flex;width:100%;gap:12px;align-items:center;text-align:left;padding:11px 14px;margin:3px 0;border:0;border-radius:10px;background:none;color:#ffe9ec;font-weight:500;letter-spacing:.2px}
#nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button:hover{background:#ffffff1f}#nav button.on{background:#fff;color:#c8001a;font-weight:700;box-shadow:0 4px 14px #0003}
#nav .badge{margin-left:auto;background:#fff;color:#c8001a;border-radius:10px;padding:0 8px;font-size:12px;line-height:20px;font-weight:700}
#nav button.on .badge{background:#c8001a;color:#fff}
.side-link{border:0;background:none;color:#ffc9cf;font-size:13px;padding:8px;text-align:center}.side-link:hover{color:#fff}
/* top bar */
main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:20px;align-items:center;padding:14px 32px;background:var(--card);border-bottom:1px solid var(--line)}
.today span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}.today b{font-size:16px}
.lang{margin-left:auto;display:flex;background:var(--soft);border-radius:10px;padding:3px}.lang button{border:0;background:none;color:var(--ink2);padding:5px 12px;border-radius:8px}.lang button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}
#view{padding:32px;overflow:auto;flex:1}.wrap{max-width:1120px;margin:0 auto}
/* type */
h1{margin:0;font-size:26px;letter-spacing:-.3px}h2{margin:0 0 14px;font-size:16px}h3{margin:0}
.sub{color:var(--mute);margin:4px 0 0}.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px}.head .sp{flex:1}
.muted{color:var(--mute)}.small{font-size:13px}.big{font-size:22px;font-weight:700}
/* buttons */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:10px}.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}.btn.pri:hover{filter:brightness(1.08)}
.btn.link{border:0;background:none;color:var(--info);padding:4px 6px}.btn.sm{padding:5px 11px;font-size:13px}.btn.ghost{color:var(--mute)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* cards & layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.grid{display:grid;gap:20px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.stack>*+*{margin-top:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.stat small{display:block;color:var(--mute);font-size:13px}.stat b{display:block;font-size:28px;margin:4px 0 2px;letter-spacing:-.5px}.stat i{font-style:normal;color:var(--mute);font-size:13px}
.divider{height:1px;background:var(--line);margin:18px 0}
/* tables */
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mute);font-size:13px;padding:0 12px 10px;white-space:nowrap}
td{padding:14px 12px;border-top:1px solid var(--line);vertical-align:middle}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}td .sub{margin:0;font-size:13px}
/* tags */
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.info{background:var(--infobg);color:var(--info)}
/* forms */
label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:500}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus{outline:2px solid var(--info);outline-offset:-1px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}.form .full{grid-column:1/-1}
details{border:1px solid var(--line);border-radius:12px;padding:0}details>summary{cursor:pointer;padding:14px 16px;list-style:none;display:flex;gap:10px;align-items:center}
details>summary::-webkit-details-marker{display:none}details>summary::after{content:"▾";margin-left:auto;color:var(--mute)}details[open]>summary::after{content:"▴"}
details .inner{padding:4px 16px 18px}
/* steps */
.steps{display:flex;gap:8px;align-items:center;margin:0 0 20px}.steps .s{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:13px}
.steps .s.done .n{background:var(--ok);color:#fff}.steps .s.cur{color:var(--ink);font-weight:600}.steps .s.cur .n{background:var(--accent);color:#fff}
.steps .bar{width:36px;height:2px;background:var(--line)}.steps .bar.done{background:var(--ok)}
/* plan cards */
.plan{border:1.5px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;background:var(--card);transition:border-color .15s}
.plan:hover{border-color:var(--mute)}.plan.sel{border-color:var(--accent);box-shadow:0 0 0 3px #c8102e1f}.plan.off{opacity:.5}
.plan .t{color:var(--ink2);font-weight:600}.plan .hero{font-size:26px;font-weight:700;margin:6px 0 2px;letter-spacing:-.5px}.plan .hero small{font-size:14px;font-weight:400;color:var(--mute)}
.plan dl{margin:14px 0 0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px}.plan dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.actionbar{position:sticky;bottom:-32px;margin:24px -32px -32px;padding:16px 32px;background:var(--card);border-top:1px solid var(--line);display:flex;gap:14px;align-items:center}
/* next step */
.next{border:1.5px solid var(--accent);background:linear-gradient(180deg,#c8102e10,transparent);border-radius:var(--r);padding:24px}
.next .k{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);font-weight:700}.next p{margin:6px 0 16px;font-size:17px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0 24px}.tabs button{border:0;background:none;color:var(--mute);padding:10px 16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
/* timeline & lists */
.tl{list-style:none;margin:0;padding:0}.tl li{position:relative;padding:0 0 18px 24px}.tl li::before{content:"";position:absolute;left:4px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.tl li::after{content:"";position:absolute;left:8px;top:18px;bottom:-2px;width:1px;background:var(--line)}.tl li:last-child::after{display:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;margin:0}.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right}
.checks{list-style:none;margin:0;padding:0}.checks li{padding:9px 0;border-top:1px solid var(--line)}.checks li:first-child{border:0}.pass{color:var(--ok)}.fail{color:var(--bad)}
pre{white-space:pre-wrap;background:var(--soft);padding:18px;border-radius:12px;font:13px/1.6 ui-monospace,Menlo,"Noto Sans Sinhala","Noto Sans Tamil",monospace;max-height:460px;overflow:auto;margin:0}
.bar2{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;display:flex}.bar2 i{display:block;height:100%}
/* toast + modal */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:var(--ink);color:var(--card);padding:12px 20px;border-radius:12px;box-shadow:0 10px 30px #0004}#toast .err{background:var(--bad);color:#fff}
#modal{position:fixed;inset:0;background:#0b0d1199;display:grid;place-items:center;z-index:40}#modal[hidden]{display:none}
#modal .box{background:var(--card);border-radius:18px;padding:28px;width:min(620px,92vw);max-height:90vh;overflow:auto}
.result{text-align:center;padding:4px 0 8px}.result .ic{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:28px}
.result .ic.ok{background:var(--okbg);color:var(--ok)}.result .ic.warn{background:var(--warnbg);color:var(--warn)}.result .ic.bad{background:var(--badbg);color:var(--bad)}
.result h2{font-size:22px;margin:0}.chips{display:flex;gap:10px;justify-content:center;margin:16px 0}.chips div{background:var(--soft);border-radius:12px;padding:10px 16px;text-align:center}.chips small{display:block;color:var(--mute);font-size:12px}.chips b{font-size:17px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-radius:10px;color:var(--ink)}.menu button:hover{background:var(--soft)}.menu small{display:block;color:var(--mute)}
.crumb{color:var(--mute);cursor:pointer;display:inline-block;margin-bottom:12px}
a{color:var(--info);text-decoration:none}

/* KPI cards: label < value > helper */
.kpi{position:relative;padding:22px 24px 20px}.kpi .lbl,.kpi .val{padding-right:52px}.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--mute);font-weight:600}
.kpi .val{font-size:34px;font-weight:700;letter-spacing:-1px;margin:10px 0 6px;line-height:1.1}.kpi .val small{font-size:15px;font-weight:500;color:var(--mute);letter-spacing:0;margin-right:4px}
.kpi .help{font-size:13px;color:var(--mute)}.kpi .ic{position:absolute;right:20px;top:18px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--ink2)}
.kpi .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi.red .ic{background:#d5001c14;color:var(--accent)}.kpi.green .ic{background:var(--okbg);color:var(--ok)}.kpi.amber .ic{background:var(--warnbg);color:var(--warn)}.kpi.blue .ic{background:var(--infobg);color:var(--info)}
.g4{grid-template-columns:repeat(4,1fr)}
.sect{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--mute);font-weight:600;margin:0 0 14px}
/* progress bar */
.progress{position:relative;margin:4px 0 32px;padding:0 6px}.progress .track{position:absolute;left:calc(100%/6);right:calc(100%/6);top:15px;height:4px;border-radius:2px;background:var(--line)}
.progress .track i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .35s}
.progress .nodes{position:relative;display:grid;grid-template-columns:repeat(3,1fr)}
.progress .node{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mute);font-size:13px;text-align:center}
.progress .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);font-weight:700;color:var(--mute)}
.progress .node.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}.progress .node.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px #d5001c1f}
.progress .node.cur .lbl,.progress .node.done .lbl{color:var(--ink);font-weight:600}
/* KYC-style verification list */
.kyc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.kyc .it{display:flex;gap:18px;align-items:center;padding:20px 24px;border-top:1px solid var(--line)}.kyc .it:first-child{border-top:0}
.kyc .mk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:var(--okbg);color:var(--ok)}.kyc .it.bad .mk{background:var(--badbg);color:var(--bad)}
.kyc .tx b{display:block}.kyc .tx span{color:var(--mute);font-size:14px}.kyc .st{margin-left:auto}
.stepcard{padding:32px}.stepcard h2{font-size:20px;margin:0 0 4px}.stepcard .lead{color:var(--mute);margin:0 0 28px}
.wiz-actions{display:flex;gap:12px;align-items:center;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.gap{margin-top:32px}
/* agreement document */
.doc{background:#fff;color:#1a1a1a;max-width:860px;margin:0 auto;padding:48px 56px;border:1px solid var(--line);box-shadow:0 8px 30px #0001;font:14px/1.55 "Inter",Arial,sans-serif}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start}.doc-ref{line-height:1.6}.doc-ref b{font-size:15px}
.doc-logo{font-weight:800;font-size:30px;letter-spacing:.3em;color:#c8001a;line-height:1}
.doc-title{font-size:20px;font-weight:800;text-decoration:underline;margin:30px 0 14px;letter-spacing:.3px}
.doc table{border:1.5px solid #1a1a1a;margin:16px 0}.doc th{color:#1a1a1a;font-weight:700;font-size:12px;border:1px solid #1a1a1a;padding:8px 10px;text-transform:uppercase;background:#f3f3f3;white-space:normal}
.doc td{border:1px solid #1a1a1a;padding:9px 10px;font-size:13.5px}.doc td.r,.doc th.r{text-align:right}
.doc-box{border:1.5px solid #1a1a1a;margin:22px 0 10px;padding:6px 12px;font-weight:800;letter-spacing:.5px}
.doc dl{display:grid;grid-template-columns:170px 1fr;gap:8px 12px;margin:12px 0 0}.doc dt{font-weight:700}.doc dd{margin:0}
.doc h3{margin:28px 0 8px;font-size:15px}.doc ol{padding-left:20px;margin:8px 0}
.doc-sign{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:44px}.doc-sign .line{border-top:1px solid #1a1a1a;margin-top:42px;padding-top:6px}
.doc-sign .signed{color:#14763a;font-weight:700;margin-top:6px;min-height:36px}.doc-foot{margin-top:34px;padding-top:12px;border-top:1px solid #ccc;font-size:12px;color:#555;text-align:center}
.doc-bar{max-width:860px;margin:0 auto 16px;display:flex;gap:12px;align-items:center}
@media print{#side,#top,#toast,.doc-bar,.tabs,.head,.crumb{display:none!important}body{display:block;height:auto;background:#fff}#view{overflow:visible;padding:0}.doc{border:0;box-shadow:none;max-width:none;padding:0}}
/* guide */
.guide{max-width:820px}.guide h1{font-size:26px;margin:0 0 6px}.guide h2{font-size:19px;margin:34px 0 10px;padding-top:6px;border-top:1px solid var(--line)}.guide h3{font-size:15px;margin:18px 0 6px}
.guide p,.guide li{color:var(--ink2)}.guide li{margin:5px 0}.guide ul,.guide ol{padding-left:22px}

/* phone and small windows: the rail becomes a scrolling strip above the page */
@media (max-width:820px){
  body{flex-direction:column;height:auto;min-height:100%}
  #side{width:100%;flex-direction:row;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px));overflow:hidden}
  .brand{padding:0;margin:0;border:0;border-right:1px solid #ffffff30;padding-right:14px;flex:none}
  .logo-word{font-size:19px;letter-spacing:.22em;padding-left:.22em}.brand-sub{display:none}
  #nav{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  #nav button{width:auto;white-space:nowrap;padding:8px 12px;margin:0}
  #nav button span:not(.badge){display:none}
  #nav button.on span:not(.badge){display:inline}
  .side-link{flex:none;padding:8px 10px;white-space:nowrap;font-size:0}
  .side-link::after{content:'Reset';font-size:13px}
  #top{padding:12px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap;gap:10px}
  .today{min-width:0}.today b{font-size:15px}
  #view{padding:22px max(16px,env(safe-area-inset-left,0px))}
  .g2,.g3,.g4,.form,.doc-sign,.doc dl{grid-template-columns:1fr}
  .doc{padding:26px max(16px,env(safe-area-inset-left,0px))}
  .progress .node .lbl{font-size:11px}
  table{min-width:520px}.card>table,.kyc{min-width:0}
  .card:has(>table){overflow-x:auto}
}

.proto{border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:3px 11px;font-size:12px;letter-spacing:.3px}
</style>

<aside id="side">
  <div class="brand"><div class="logo-word">SINGER</div><div class="brand-sub">CREDIT</div></div>
  <nav id="nav"></nav>
  <button class="side-link" data-act="reset">Reset demo data</button>
</aside>
<main>
  <header id="top">
    <span class="proto">Prototype</span>
    <div class="today"><span>Today</span><b id="clock">-</b></div>
    <div class="lang" id="langSwitch"></div>
  </header>
  <div id="toast"></div>
  <section id="view"></section>
</main>
<div id="modal" hidden></div>

// Sri Lankan NIC: old 9 digits + V/X (YYDDD), new 12 digits (YYYYDDD). DDD > 500 means female.
function parseNic(raw) {

  let year, days;

  if (b.getUTCMonth() < a.getUTCMonth() || (b.getUTCMonth() === a.getUTCMonth() && b.getUTCDate() < a.getUTCDate())) age--;
  return age;

      o.labels[lg] = [
        [L.cashPrice, lkr(o.cashPrice - o.saleDiscount)], [L.downPayment, lkr(o.downPayment)], [L.loanAmount, lkr(o.principal)],
        [L.charges, lkr(o.charge + o.fee)], [L.instalment, `${lkr(o.instalment)} × ${o.tenor} ${L.months}`], [L.totalRepayable, lkr(o.total + o.downPayment)]
      ];
    }
    options.push(o);
  }
  return { nic, tier, minDownPayment: minDown, downPaymentOk: downPayment >= minDown, notes, options, productLimits: prod };
}

// ---------------------------------------------------------------- schedule (LM-11, LM-12)
function isBusinessDay(p, s) {
  const dt = d(s);
  const wd = dt.getUTCDay();
  const md = s.slice(5);
  return wd !== 0 && wd !== 6 && !p.holidays.includes(md);
}
function nextBusinessDay(p, s) { let x = s; while (!isBusinessDay(p, x)) x = addDays(x, 1); return x; }

function buildRows(state, loan, start, count) {
  const p = pol(state);
  const rows = [];
  const day = loan.dueDay;
  // Each instalment is the quoted (rounded-up) amount; the last absorbs the rounding difference.
  let pp = 0, cc = 0, ff = 0, paidTotal = 0;
  for (let i = 0; i < count; i++) {
    const nominal = addMonths(start, 1 + i, day);
    const last = i === count - 1;
    const T = last ? r2(loan.total - paidTotal) : loan.instalment;
    paidTotal += T;
    const principal = last ? r2(loan.principal - pp) : r2(T * loan.principal / loan.total);
    const charge = last ? r2(loan.charge - cc) : r2(T * loan.charge / loan.total);
    const fee = last ? r2(loan.fee - ff) : r2(T - principal - charge);
    pp += principal; cc += charge; ff += fee;
    rows.push({ no: 1 + i, nominal, due: nextBusinessDay(p, nominal), principal, charge, fee, penalty: 0, paid: { penalty: 0, fee: 0, charge: 0, principal: 0 }, lateFeeCharged: false, lastAccrual: null });
  }
  return rows;
}

function generateSchedule(state, loan, start, reason) {
  const before = loan.schedule ? { version: loan.schedule.version, rows: loan.schedule.rows.length } : null;
  if (loan.schedule) loan.scheduleHistory.push({ version: loan.schedule.version, reason: loan.schedule.reason, at: loan.schedule.at, rows: clone(loan.schedule.rows) });
  const rows = buildRows(state, loan, start, loan.tenor);
  // Rounded instalment: keep ledger components but make instalment total match the quoted instalment where possible.
  loan.schedule = { version: loan.scheduleHistory.length + 1, reason, at: state.clock, rows };
  audit(state, 'system', 'schedule.generate', loan.id, before, { version: loan.schedule.version, reason });
}

function rowBase(r) { return r2(r.principal + r.charge + r.fee); }
function rowOwed(r, comps = COMPS) { return r2(comps.reduce((s, k) => s + r[k] - r.paid[k], 0)); }

// ---------------------------------------------------------------- application & decision (LM-19)
function createApplication(state, input, actor = 'website') {
  const c = state.customers[input.nic];
  if (!c) throw new Error('Customer not registered');
  const p = pol(state);
  const appId = nextId(state, 'app', 'APP-');
  const app = { id: appId, nic: input.nic, product: input.product, cashPrice: input.cashPrice, downPayment: input.downPayment || 0, promoCode: input.promoCode || null, tenor: input.tenor, lang: input.lang || c.lang, orderId: input.orderId || 'ORD-' + appId.slice(4), createdAt: state.clock, decisions: [], status: 'new' };
  state.applications[appId] = app;
  // fresh assessment from submitted documents
  const as = assessLimit(state, input.nic, input.docs || {}, 'decision.engine');
  const tier = as.assessment.tier;
  const tierCfg = p.tiers[tier];
  const reasons = [];
  const prod = p.products[input.product];
  const opt = tierCfg.tenors.includes(input.tenor) ? priceOption(state, { cashPrice: input.cashPrice, downPayment: app.downPayment, product: input.product, tier, promoCode: input.promoCode, tenor: input.tenor }) : null;
  if (!opt) reasons.push(`Tenor ${input.tenor} months is not available for tier ${tier}`);
  if (opt) {
    if (opt.principal < prod.min || opt.principal > prod.max) reasons.push(`Loan amount outside product limits (${lkr(prod.min)} - ${lkr(prod.max)})`);
    if (app.downPayment < r2(input.cashPrice * tierCfg.minDownPct)) reasons.push(`Down payment below tier minimum (${(tierCfg.minDownPct * 100).toFixed(0)}%)`);
  }
  const elig = eligibility(state, input.nic, { category: input.product, price: input.cashPrice, loanTotal: opt ? opt.total : undefined });
  for (const k of elig.checks) if (!k.pass) reasons.push(`${k.rule}: ${k.detail}`);
  const guarantorNeeded = opt && (opt.principal > p.guarantor.requiredAbove || p.guarantor.requiredForTiers.includes(tier));
  let guarantorCheck = null;
  if (guarantorNeeded) {
    if (!input.guarantor || !input.guarantor.nic || !input.guarantor.consent) reasons.push('Guarantor required: NIC, relationship and consent must be captured');
    else {
      const g = state.customers[input.guarantor.nic];
      const ok = g && !g.ifs.hpDelinquent && g.ifs.hpOutstanding < 100000;
      guarantorCheck = { nic: input.guarantor.nic, relationship: input.guarantor.relationship, consent: true, passed: !!ok, detail: g ? `HP outstanding ${lkr(g.ifs.hpOutstanding)}` : 'Guarantor not found in SINGER records' };
      if (!ok) reasons.push('Guarantor failed separate exposure check');
    }
  }
  const tamper = as.assessment.documents.tamperRisk >= 70;
  let outcome, refer = [];
  if (reasons.length) outcome = 'decline';
  else if (tier === 'D') { outcome = 'decline'; reasons.push('Risk tier D'); }
  else if (tamper) { outcome = 'refer'; refer.push('Document tamper suspected'); }
  else if (tier === 'C') { outcome = 'refer'; refer.push('Risk tier C requires manual assessment'); }
  else if (opt.principal > tierCfg.autoApproveMax) { outcome = 'refer'; refer.push(`Loan amount above auto-approval authority for tier ${tier} (${lkr(tierCfg.autoApproveMax)})`); }
  else outcome = 'approve';
  app.assessment = as.assessment;
  app.eligibility = elig;
  app.guarantor = guarantorCheck;
  app.option = opt;
  app.explain = { rules: elig.checks, scorecard: as.assessment.factors, tier, score: as.assessment.score, outcome, reasons, refer };
  audit(state, actor, 'application.create', appId, null, { nic: app.nic, product: app.product, cashPrice: app.cashPrice });
  audit(state, 'decision.engine', 'credit.decision', appId, null, app.explain);
  if (outcome === 'decline') { app.status = 'declined'; app.declineReasons = reasons; return { app, loan: null }; }
  if (outcome === 'refer') {
    app.status = 'referred'; app.referReasons = refer;
    app.sla = { dueBy: `${state.clock} +${p.slaHours}h`, hours: p.slaHours };
    return { app, loan: null };
  }
  const loan = approveApplication(state, app, 'decision.engine');
  return { app, loan };
}

function approveApplication(state, app, actor) {
  const opt = app.option;
  const c = state.customers[app.nic];
  const loan = {
    id: nextId(state, 'loan', 'LN-'), appId: app.id, nic: app.nic, product: app.product, lang: app.lang,
    cashPrice: opt.cashPrice, saleDiscount: opt.saleDiscount, downPayment: opt.downPayment, principal: opt.principal,
    annualFlatRate: opt.annualFlatRate, tenor: opt.tenor, charge: opt.charge, fee: opt.fee, total: opt.total, instalment: opt.instalment,
    tier: c.tier, promo: opt.promo, status: 'approved', timeline: [{ status: 'applied', at: app.createdAt }, { status: 'approved', at: state.clock, note: actor }],
    dueDay: parseInt(state.clock.slice(8), 10), scheduleHistory: [], schedule: null, payments: [], creditBalance: 0,
    order: { id: app.orderId, event: null }, agreement: null, ptp: [], contacts: [], settlementQuotes: [], frozen: false, downPaymentVerified: false, guarantor: app.guarantor
  };
  const allowed = pol(state).dueDay.allowedDays;
  if (pol(state).dueDay.rule === 'fixed_day') loan.dueDay = allowed.find(x => x >= loan.dueDay) || allowed[0];
  generateSchedule(state, loan, state.clock, 'initial (indicative)');
  state.loans[loan.id] = loan;
  app.status = 'approved'; app.loanId = loan.id;
  if (opt.saleDiscount > 0) state.ifsPostings.push({ at: state.clock, type: 'SALE_DISCOUNT', loan: loan.id, amount: opt.saleDiscount, promo: opt.promo });
  audit(state, actor, 'loan.approve', loan.id, null, { status: 'approved', total: loan.total });
  notify(state, 'approval', loan, loan.lang, { amount: lkr(loan.principal) });
  return loan;
}

function manualDecision(state, appId, { decision, user, role, note }) {
  const app = state.applications[appId];
  if (!app || app.status !== 'referred') throw new Error('Application is not in the underwriter queue');
  const p = pol(state);
  const limit = p.approvalAuthority[role] || 0;
  const before = clone(app);
  if (decision === 'approve') {
    if (app.option.principal > limit) throw new Error(`Approval authority exceeded: ${role} may approve up to ${lkr(limit)}`);
    app.decisions.push({ by: user, role, decision, note, at: state.clock });
    audit(state, user, 'application.manual_approve', appId, before, app, note);
    return { app, loan: approveApplication(state, app, user) };
  }
  app.status = 'declined'; app.declineReasons = [note || 'Declined by underwriter'];
  app.decisions.push({ by: user, role, decision, note, at: state.clock });
  audit(state, user, 'application.manual_decline', appId, before, app, note);
  const c = state.customers[app.nic];
  state.outbox.push({ at: state.clock, event: 'decline', channel: 'sms', lang: app.lang, nic: app.nic, loan: '', text: render('decline', app.lang, { name: c.name, reason: app.declineReasons[0] }) });
  return { app, loan: null };
}

// ---------------------------------------------------------------- agreement, e-sign, activation (LM-20..22)

function recordSigned(state, loanId, docRef) {
  const loan = state.loans[loanId];
  if (!loan.agreement) throw new Error('Generate and send the agreement first');
  loan.agreement.signedAt = state.clock;
  loan.agreement.docRef = docRef || 'ESIGN-' + loan.id;
  loan.status = 'signed';
  loan.timeline.push({ status: 'signed', at: state.clock, note: loan.agreement.docRef });
  audit(state, 'esign.webhook', 'agreement.signed', loanId, null, { docRef: loan.agreement.docRef });
  return loan;
}

function orderEvent(state, loanId, event, opts = {}) {
  const loan = state.loans[loanId];
  const p = pol(state);
  loan.order.event = event;
  if (event === 'cancelled') return cancelLoan(state, loanId, 'order cancelled');
  if (event !== p.activationEvent) return loan;
  if (loan.status !== 'signed') throw new Error('No loan proceeds without a signed agreement');
  if (loan.downPayment > 0 && !loan.downPaymentVerified) {
    if (opts.downPaymentReceived === false) throw new Error('Down payment not received/verified');
    loan.downPaymentVerified = true;
  }
  loan.status = 'active';
  loan.activatedAt = state.clock;
  loan.dueDay = parseInt(state.clock.slice(8), 10);
  if (p.dueDay.rule === 'fixed_day') loan.dueDay = opts.dueDay || p.dueDay.allowedDays.find(x => x >= loan.dueDay) || p.dueDay.allowedDays[0];
  generateSchedule(state, loan, state.clock, 'activation');
  loan.timeline.push({ status: 'active', at: state.clock, note: `Order ${loan.order.id} ${event}` });
  state.ifsPostings.push({ at: state.clock, type: 'DISBURSEMENT_TO_SINGER', loan: loan.id, amount: loan.principal, order: loan.order.id });
  audit(state, 'ecommerce.webhook', 'loan.activate', loan.id, null, { status: 'active', proceedsTo: 'SINGER', order: loan.order.id });
  const first = loan.schedule.rows[0];
  notify(state, 'schedule', loan, loan.lang, { n: loan.tenor, amount: lkr(rowBase(first)), due: first.due });
  return loan;
}

function changeDueDate(state, loanId, newDay, approver) {
  const loan = state.loans[loanId];
  const p = pol(state);
  if (!p.dueDay.allowedDays.includes(newDay)) throw new Error('Due date not in permitted list: ' + p.dueDay.allowedDays.join(', '));
  if (loan.dueDateChanged) throw new Error('One-time due-date change already used');
  if (!approver) throw new Error('Approval required');
  const before = clone(loan.schedule.rows.map(r => r.due));
  loan.dueDay = newDay;
  const unpaid = loan.schedule.rows.filter(r => r.due > state.clock && rowOwed(r) > 0);
  loan.scheduleHistory.push({ version: loan.schedule.version, reason: loan.schedule.reason, at: loan.schedule.at, rows: clone(loan.schedule.rows) });
  unpaid.forEach((r, i) => { r.nominal = addMonths(state.clock, i + 1, newDay); r.due = nextBusinessDay(p, r.nominal); });
  loan.schedule.version++; loan.schedule.reason = `due date moved to day ${newDay}`; loan.schedule.at = state.clock;
  loan.dueDateChanged = true;
  audit(state, approver, 'loan.due_date_change', loanId, before, loan.schedule.rows.map(r => r.due));
  return loan;
}

// ---------------------------------------------------------------- payments (LM-23, LM-24)
function allocate(state, loan, amount, asOf) {
  const p = pol(state);
  const allocs = [];
  let rem = r2(amount);
  const rows = loan.schedule.rows;
  const pass = filter => {
    for (const row of rows) {
      if (rem <= 0) break;
      if (!filter(row)) continue;
      for (const comp of p.allocationOrder) {
        const owed = r2(row[comp] - row.paid[comp]);
        if (owed <= 0) continue;
        const pay = Math.min(owed, rem);
        row.paid[comp] = r2(row.paid[comp] + pay);
        rem = r2(rem - pay);
        allocs.push({ no: row.no, comp, amount: pay });
        if (rem <= 0) break;
      }
    }
  };
  pass(r => r.due <= asOf);
  if (rem > 0 && p.overpayment === 'next_instalment') pass(r => r.due > asOf);
  return { allocs, remainder: rem };
}

function postPayment(state, loanId, { amount, channel = 'branch', date, ref }, actor = 'system') {
  const loan = state.loans[loanId];
  if (!['active', 'in_arrears'].includes(loan.status)) throw new Error('Loan is not collectable: ' + loan.status);
  const asOf = date || state.clock;
  accrueLoan(state, loan, asOf);
  const before = { outstanding: loanOutstanding(loan), creditBalance: loan.creditBalance };
  const { allocs, remainder } = allocate(state, loan, amount, asOf);
  if (remainder > 0) loan.creditBalance = r2(loan.creditBalance + remainder);
  const pay = { id: nextId(state, 'pay', 'PAY-'), date: asOf, amount: r2(amount), channel, ref: ref || '', allocations: allocs, toCreditBalance: remainder };
  loan.payments.push(pay);
  refreshStatus(state, loan);
  audit(state, actor, 'payment.post', loanId, before, { outstanding: loanOutstanding(loan), creditBalance: loan.creditBalance, payment: pay.id, amount: pay.amount, channel });
  notify(state, 'receipt', loan, loan.lang, { amount: lkr(amount) });
  if (loan.status === 'active' && loanOutstanding(loan) <= 0.005) closeLoan(state, loan, 'settled', 'Final instalment paid');
  return pay;
}

function reversePayment(state, loanId, payId, approver, reason) {
  const loan = state.loans[loanId];
  const pay = loan.payments.find(x => x.id === payId);
  if (!pay || pay.reversed) throw new Error('Payment not found or already reversed');
  if (!approver) throw new Error('Authorised approval required');
  for (const a of pay.allocations) {
    const row = loan.schedule.rows.find(r => r.no === a.no);
    row.paid[a.comp] = r2(row.paid[a.comp] - a.amount);
  }
  loan.creditBalance = r2(loan.creditBalance - pay.toCreditBalance);
  pay.reversed = { by: approver, at: state.clock, reason };
  if (loan.status === 'settled') { loan.status = 'active'; loan.timeline.push({ status: 'active', at: state.clock, note: 'payment reversed' }); }
  refreshStatus(state, loan);
  audit(state, approver, 'payment.reverse', loanId, { payment: payId, amount: pay.amount }, { reversed: true }, reason);
  return pay;
}

// ---------------------------------------------------------------- accrual, delinquency (LM-13, LM-27)
function dpdOf(loan, asOf) {
  if (!loan.schedule) return 0;
  let worst = 0;
  for (const r of loan.schedule.rows) if (r.due < asOf && rowOwed(r, ['fee', 'charge', 'principal']) > 0.005) worst = Math.max(worst, diffDays(asOf, r.due));
  return worst;
}

function accrueLoan(state, loan, asOf) {
  if (!['active', 'in_arrears'].includes(loan.status)) return;
  const p = pol(state);
  const monthlyRate = p.penalRatePerMonth;
  for (const r of loan.schedule.rows) {
    const graceEnd = addDays(r.due, p.graceDays);
    let t = r.lastAccrual || graceEnd;
    if (asOf <= graceEnd) continue;
    const cap = Math.max(p.lateFee, r2(rowBase(r) * p.penaltyCapPctOfInstalment));
    while (t < asOf) {
      t = addDays(t, 1);
      if (t <= graceEnd) continue;
      const unpaidBase = rowOwed(r, ['fee', 'charge', 'principal']);
      if (unpaidBase <= 0.005) break;
      if (!r.lateFeeCharged) { r.penalty = r2(Math.min(cap, r.penalty + p.lateFee)); r.lateFeeCharged = true; }
      r.penalty = r2(Math.min(cap, r.penalty + unpaidBase * monthlyRate / 30));
    }
    r.lastAccrual = asOf;
  }
}

function refreshStatus(state, loan) {
  if (!['active', 'in_arrears'].includes(loan.status)) return;
  const dpd = dpdOf(loan, state.clock);
  const next = dpd > 0 ? 'in_arrears' : 'active';
  if (next !== loan.status) { loan.status = next; loan.timeline.push({ status: next, at: state.clock }); }
  loan.dpd = dpd;
}

function closeLoan(state, loan, status, note) {
  loan.status = status;
  loan.closedAt = state.clock;
  loan.timeline.push({ status, at: state.clock, note });
  if (status === 'settled') notify(state, 'closure', loan, loan.lang);
  audit(state, 'system', 'loan.' + status, loan.id, null, { note });
}

function waivePenalty(state, loanId, rowNo, amount, approver, reason) {
  if (!approver) throw new Error('Waiver requires approval workflow');
  const loan = state.loans[loanId];
  const row = loan.schedule.rows.find(r => r.no === rowNo);
  const open = r2(row.penalty - row.paid.penalty);
  const w = Math.min(open, amount);
  const before = { penalty: row.penalty };
  row.penalty = r2(row.penalty - w);
  audit(state, approver, 'penalty.waive', loanId, before, { penalty: row.penalty, waived: w }, reason);
  return w;
}

// ---------------------------------------------------------------- early settlement (LM-25)
function settlementQuote(state, loanId) {
  const loan = state.loans[loanId];
  const p = pol(state);
  const asOf = state.clock;
  accrueLoan(state, loan, asOf);
  const rows = loan.schedule.rows;
  const dueRows = rows.filter(r => r.due <= asOf);
  const future = rows.filter(r => r.due > asOf && rowOwed(r) > 0.005);
  const dueAmount = r2(dueRows.reduce((s, r) => s + rowOwed(r), 0));
  const fp = r2(future.reduce((s, r) => s + r.principal - r.paid.principal, 0));
  const fc = r2(future.reduce((s, r) => s + r.charge - r.paid.charge, 0));
  const ff = r2(future.reduce((s, r) => s + r.fee - r.paid.fee, 0));
  const k = future.length, n = loan.tenor;
  const rebate = p.settlement.method === 'rule78' ? Math.min(fc, r2(loan.charge * (k * (k + 1)) / (n * (n + 1)))) : fc;
  const discount = k > 0 ? r2(fp * p.settlement.discountPct) : 0;
  const amount = r2(Math.max(0, dueAmount + fp + ff + (fc - rebate) - discount - loan.creditBalance));
  const q = { id: nextId(state, 'quote', 'SQ-'), loan: loanId, createdAt: asOf, validUntil: addDays(asOf, p.settlement.validityDays), method: p.settlement.method,
    breakdown: { overdueAndDue: dueAmount, remainingPrincipal: fp, remainingFees: ff, remainingCharges: fc, unearnedChargeRebate: rebate, settlementDiscount: discount, creditBalance: loan.creditBalance }, amount };
  loan.settlementQuotes.push(q);
  audit(state, 'system', 'settlement.quote', loanId, null, q);
  notify(state, 'settlement', loan, loan.lang, { amount: lkr(amount), due: q.validUntil });
  return q;
}

function settleLoan(state, loanId, quoteId, channel = 'branch') {
  const loan = state.loans[loanId];
  const q = loan.settlementQuotes.find(x => x.id === quoteId);
  if (!q) throw new Error('Settlement quote not found');
  if (state.clock > q.validUntil) throw new Error('Settlement quote expired on ' + q.validUntil);
  const pay = { id: nextId(state, 'pay', 'PAY-'), date: state.clock, amount: q.amount, channel, allocations: [], toCreditBalance: 0, settlement: q.id };
  loan.payments.push(pay);
  for (const r of loan.schedule.rows) for (const k of COMPS) r.paid[k] = r[k];
  loan.rebate = { amount: q.breakdown.unearnedChargeRebate, discount: q.breakdown.settlementDiscount };
  if (q.breakdown.settlementDiscount > 0) state.ifsPostings.push({ at: state.clock, type: 'SETTLEMENT_DISCOUNT', loan: loanId, amount: q.breakdown.settlementDiscount });
  loan.creditBalance = 0;
  closeLoan(state, loan, 'settled', `Early settlement ${q.id}`);
  audit(state, 'system', 'settlement.complete', loanId, null, { quote: q.id, paid: q.amount, rebate: q.breakdown.unearnedChargeRebate });
  return loan;
}

// Shared by partial settlement and goods return: reduce future principal and its charge proportionally.
function applyCredit(state, loan, amount, kind) {
  const asOf = state.clock;
  accrueLoan(state, loan, asOf);
  let rem = amount;
  const dueRows = loan.schedule.rows.filter(r => r.due <= asOf);
  const p = pol(state);
  const allocs = [];
  for (const row of dueRows) for (const comp of p.allocationOrder) {
    const owed = r2(row[comp] - row.paid[comp]);
    if (owed <= 0 || rem <= 0) continue;
    const pay = Math.min(owed, rem);
    row.paid[comp] = r2(row.paid[comp] + pay); rem = r2(rem - pay); allocs.push({ no: row.no, comp, amount: pay });
  }
  const future = loan.schedule.rows.filter(r => r.due > asOf && rowOwed(r) > 0.005);
  const fp = r2(future.reduce((s, r) => s + r.principal - r.paid.principal, 0));
  loan.scheduleHistory.push({ version: loan.schedule.version, reason: loan.schedule.reason, at: loan.schedule.at, rows: clone(loan.schedule.rows) });
  let refund = 0, chargeReduced = 0;
  if (rem >= fp && fp >= 0) {
    refund = r2(rem - fp);
    for (const r of future) { chargeReduced += r.charge - r.paid.charge; for (const k of ['principal', 'charge', 'fee']) r[k] = r.paid[k]; }
    rem = 0;
  } else if (fp > 0) {
    const f = (fp - rem) / fp;
    for (const r of future) {
      const up = r.principal - r.paid.principal, uc = r.charge - r.paid.charge;
      r.principal = r2(r.paid.principal + up * f);
      const newC = r2(r.paid.charge + uc * f);
      chargeReduced += r.charge - newC; r.charge = newC;
    }
  }
  loan.schedule.version++; loan.schedule.reason = kind; loan.schedule.at = state.clock;
  return { allocs, refund, chargeReduced: r2(chargeReduced), futurePrincipalBefore: fp };
}

function partialSettle(state, loanId, amount, channel = 'branch') {
  const loan = state.loans[loanId];
  const before = { outstanding: loanOutstanding(loan) };
  const res = applyCredit(state, loan, amount, 'partial settlement');
  loan.payments.push({ id: nextId(state, 'pay', 'PAY-'), date: state.clock, amount, channel, allocations: res.allocs, toCreditBalance: 0, partialSettlement: true, rebate: res.chargeReduced });
  refreshStatus(state, loan);
  audit(state, 'system', 'settlement.partial', loanId, before, { outstanding: loanOutstanding(loan), chargeRebated: res.chargeReduced });
  if (loanOutstanding(loan) <= 0.005) closeLoan(state, loan, 'settled', 'Partial settlement cleared the loan');
  return { loan, ...res };
}

// ---------------------------------------------------------------- cancellation / returns (LM-26)
function cancelLoan(state, loanId, reason) {
  const loan = state.loans[loanId];
  if (!['approved', 'signed'].includes(loan.status)) throw new Error('Only pre-activation loans can be cancelled; use return for active loans');
  closeLoan(state, loan, 'cancelled', reason);
  const app = state.applications[loan.appId];
  if (app) app.status = 'cancelled';
  return loan; // exposure reservation released because exposure() ignores cancelled loans
}

function returnGoods(state, loanId, returnValue, approver, reason) {
  if (!approver) throw new Error('Return requires approval');
  const loan = state.loans[loanId];
  if (!['active', 'in_arrears'].includes(loan.status)) throw new Error('Loan is not active');
  const before = { outstanding: loanOutstanding(loan), instalment: rowBase(loan.schedule.rows.find(r => r.due > state.clock) || loan.schedule.rows[0]) };
  const res = applyCredit(state, loan, returnValue, 'goods return');
  loan.payments.push({ id: nextId(state, 'pay', 'PAY-'), date: state.clock, amount: returnValue, channel: 'return_credit', allocations: res.allocs, toCreditBalance: 0, refund: res.refund });
  refreshStatus(state, loan);
  const next = loan.schedule.rows.find(r => r.due > state.clock && rowOwed(r) > 0.005);
  audit(state, approver, 'loan.return', loanId, before, { outstanding: loanOutstanding(loan), revisedInstalment: next ? rowBase(next) : 0, refundDue: res.refund, limitRestoredBy: before.outstanding - loanOutstanding(loan) }, reason);
  if (loanOutstanding(loan) <= 0.005) closeLoan(state, loan, 'settled', 'Closed after return');
  return { loan, refund: res.refund, revisedInstalment: next ? rowBase(next) : 0, chargeRebated: res.chargeReduced };
}

// ---------------------------------------------------------------- collections (LM-27, LM-28)
function bucketOf(p, dpd) {
  const b = p.arrearsBuckets.find(([a, z]) => dpd >= a && dpd <= z);
  return b ? (b[1] >= 9999 ? `${b[0]}+` : `${b[0]}-${b[1]}`) : 'Current';
}

function collectionQueue(state) {
  const p = pol(state);
  const rows = [];
  for (const l of Object.values(state.loans)) {
    if (l.status !== 'in_arrears') continue;
    const dpd = dpdOf(l, state.clock);
    const overdue = r2(l.schedule.rows.filter(r => r.due < state.clock).reduce((s, r) => s + rowOwed(r), 0));
    rows.push({ loan: l.id, nic: l.nic, name: state.customers[l.nic].name, phone: state.customers[l.nic].phone, dpd, bucket: bucketOf(p, dpd), overdue, outstanding: loanOutstanding(l), ptp: l.ptp.filter(x => !x.kept).slice(-1)[0] || null, lastContact: l.contacts.slice(-1)[0] || null });
  }
  return rows.sort((a, b) => b.dpd - a.dpd);
}

function recordContact(state, loanId, { outcome, note, user }) {
  const loan = state.loans[loanId];
  loan.contacts.push({ at: state.clock, user, outcome, note });
  audit(state, user, 'collection.contact', loanId, null, { outcome, note });
}

function recordPTP(state, loanId, { date, amount, user }) {
  const loan = state.loans[loanId];
  loan.ptp.push({ at: state.clock, promiseDate: date, amount, user, kept: false });
  audit(state, user, 'collection.ptp', loanId, null, { date, amount });
}

function restructure(state, loanId, extraMonths, approver, reason) {
  if (!approver) throw new Error('Restructuring requires approval');
  const loan = state.loans[loanId];
  const p = pol(state);
  const open = loan.schedule.rows.filter(r => rowOwed(r, ['fee', 'charge', 'principal']) > 0.005);
  const keep = loan.schedule.rows.filter(r => r.due <= state.clock);
  const future = loan.schedule.rows.filter(r => r.due > state.clock && rowOwed(r) > 0.005);
  const before = { instalmentsLeft: open.length, outstanding: loanOutstanding(loan) };
  loan.scheduleHistory.push({ version: loan.schedule.version, reason: loan.schedule.reason, at: loan.schedule.at, rows: clone(loan.schedule.rows) });
  const sum = k => r2(future.reduce((s, r) => s + r[k] - r.paid[k], 0));
  const P = sum('principal'), C = sum('charge'), F = sum('fee');
  const count = future.length + extraMonths;
  const rows = keep.slice();
  let ap = 0, ac = 0, af = 0;
  const lastKept = keep.length;
  for (let i = 0; i < count; i++) {
    const last = i === count - 1;
    const principal = last ? r2(P - ap) : r2(P / count), charge = last ? r2(C - ac) : r2(C / count), fee = last ? r2(F - af) : r2(F / count);
    ap += principal; ac += charge; af += fee;
    const nominal = addMonths(state.clock, i + 1, loan.dueDay);
    rows.push({ no: lastKept + i + 1, nominal, due: nextBusinessDay(p, nominal), principal, charge, fee, penalty: 0, paid: { penalty: 0, fee: 0, charge: 0, principal: 0 }, lateFeeCharged: false, lastAccrual: null });
  }
  loan.schedule.rows = rows; loan.tenor = rows.length;
  loan.schedule.version++; loan.schedule.reason = `restructured +${extraMonths} months`; loan.schedule.at = state.clock;
  refreshStatus(state, loan);
  audit(state, approver, 'loan.restructure', loanId, before, { instalmentsLeft: count, outstanding: loanOutstanding(loan) }, reason);
  return loan;
}

function writeOff(state, loanId, approver, reason) {
  if (!approver) throw new Error('Write-off requires approval');
  const loan = state.loans[loanId];
  const amount = loanOutstanding(loan);
  loan.writeOffAmount = amount;
  closeLoan(state, loan, 'written_off', reason);
  state.customers[loan.nic].blocked = true;
  audit(state, approver, 'loan.write_off', loanId, { outstanding: amount }, { status: 'written_off' }, reason);
  return loan;
}

// ---------------------------------------------------------------- daily batch / direct debit simulation (LM-23)
function advanceDays(state, days) {
  const p = pol(state);
  for (let i = 0; i < days; i++) {
    state.clock = addDays(state.clock, 1);
    for (const loan of Object.values(state.loans)) {
      if (!['active', 'in_arrears'].includes(loan.status)) continue;
      const c = state.customers[loan.nic];
      // pre-debit reminder
      for (const r of loan.schedule.rows) {
        if (rowOwed(r) > 0.005 && addDays(state.clock, p.directDebit.reminderDaysBefore) === r.due) notify(state, 'pre_debit', loan, loan.lang, { amount: lkr(rowOwed(r)), due: r.due });
      }
      accrueLoan(state, loan, state.clock);
      // direct-debit attempts on due date and configured retry offsets
      const dueRows = loan.schedule.rows.filter(r => rowOwed(r, ['fee', 'charge', 'principal']) > 0.005 && p.directDebit.retryOffsets.some(o => addDays(r.due, o) === state.clock));
      for (const r of dueRows) {
        const amt = rowOwed(r);
        loan.ddLog = loan.ddLog || [];
        if (c.sim.autoPay && c.bank.mandate === 'active') {
          loan.ddLog.push({ at: state.clock, row: r.no, amount: amt, result: 'success' });
          postPayment(state, loan.id, { amount: amt, channel: 'direct_debit' }, 'direct.debit');
        } else loan.ddLog.push({ at: state.clock, row: r.no, amount: amt, result: 'failed' });
      }
      if (loan.creditBalance > 0) {
        const open = loan.schedule.rows.filter(r => r.due <= state.clock && rowOwed(r) > 0.005);
        if (open.length) { const use = loan.creditBalance; loan.creditBalance = 0; const { remainder } = allocate(state, loan, use, state.clock); loan.creditBalance = remainder; }
      }
      const was = loan.status;
      refreshStatus(state, loan);
      if (loan.status === 'in_arrears') {
        const dpd = dpdOf(loan, state.clock);
        if (was === 'active') notify(state, 'missed', loan, loan.lang, { days: dpd, amount: lkr(r2(loan.schedule.rows.filter(r => r.due < state.clock).reduce((s, r) => s + rowOwed(r), 0))) });
        if (dpd >= p.freezeDpd && c.limitStatus === 'active') { setLimit(state, loan.nic, 'freeze', 'auto.freeze'); }
        for (const t of loan.ptp) if (!t.kept && state.clock > t.promiseDate) t.kept = loan.payments.some(x => x.date >= t.at && x.date <= t.promiseDate) ? true : 'broken';
      }
      if (loan.status === 'active' && c.limitStatus === 'frozen' && !Object.values(state.loans).some(l => l.nic === c.nic && l.status === 'in_arrears')) setLimit(state, c.nic, 'reactivate', 'auto.reactivate');
    }
  }
  return state.clock;
}

// ---------------------------------------------------------------- policy admin (LM-35, LM-N08)
function updatePolicy(state, patch, effective, actor) {
  const current = clone(pol(state));
  const next = Object.assign(current, patch);
  const errors = validatePolicy(next);
  if (errors.length) throw new Error(errors.join('; '));
  state.policy.versions = state.policy.versions.filter(v => v.effective !== effective);
  state.policy.versions.push({ effective, data: next });
  audit(state, actor, 'policy.update', 'policy@' + effective, null, patch);
  return next;
}

// ---------------------------------------------------------------- reporting (LM-33)
function reports(state) {
  const p = pol(state);
  const apps = Object.values(state.applications);
  const byTier = {};
  for (const a of apps) {
    const t = (a.explain && a.explain.tier) || 'n/a';
    byTier[t] = byTier[t] || { approved: 0, declined: 0, referred: 0 };
    const k = ['approved', 'cancelled'].includes(a.status) ? 'approved' : a.status === 'declined' ? 'declined' : 'referred';
    byTier[t][k]++;
  }
  const ageing = { Current: 0 };
  for (const [a, z] of p.arrearsBuckets) ageing[z >= 9999 ? `${a}+` : `${a}-${z}`] = 0;
  let disbursed = 0, outstanding = 0, discounts = 0;
  for (const l of Object.values(state.loans)) {
    if (l.activatedAt) disbursed += l.principal;
    const o = loanOutstanding(l);
    outstanding += o;
    if (['active', 'in_arrears'].includes(l.status)) ageing[bucketOf(p, dpdOf(l, state.clock))] += o;
  }
  for (const x of state.ifsPostings) if (x.type.endsWith('DISCOUNT')) discounts += x.amount;
  const exposures = Object.values(state.customers).filter(c => c.limitStatus !== 'unassessed').map(c => ({ nic: c.nic, name: c.name, tier: c.tier, ...exposure(state, c.nic), limitStatus: c.limitStatus }));
  const hp = exposures.reduce((s, e) => s + e.hp, 0), credit = exposures.reduce((s, e) => s + e.credit, 0);
  return { byTier, ageing, disbursed: r2(disbursed), outstanding: r2(outstanding), discounts: r2(discounts), exposures, hpVsCredit: { hp: r2(hp), credit: r2(credit) },
    counts: { loans: Object.keys(state.loans).length, active: Object.values(state.loans).filter(l => l.status === 'active').length, arrears: Object.values(state.loans).filter(l => l.status === 'in_arrears').length, referred: apps.filter(a => a.status === 'referred').length } };
}

async function wizNext() {
  const d = readDraft();
  S.draft = Object.assign(d, { tenor: undefined });
  W.kyc = await api('precheck', d.nic, d.product, d.cashPrice);
  W.quote = await api('quote', { nic: d.nic, product: d.product, cashPrice: d.cashPrice, downPayment: d.downPayment, promoCode: d.promoCode, docs: d.docs });
  W.step = 2; await go('apply');
}

async function doSubmit() {
  const d = S.draft;
  if (!d.tenor) return toast('Select a plan first', true);
  const input = { nic: d.nic, product: d.product, cashPrice: d.cashPrice, downPayment: d.downPayment, promoCode: d.promoCode || null, tenor: d.tenor, orderId: d.orderId, docs: d.docs, lang: S.lang };
  if (d.gnic) input.guarantor = { nic: d.gnic, relationship: d.grel, consent: true };
  W.result = await api('apply', input);
  W.step = 3; await go('apply');
}

function nextStep(l) {
  const id = `data-id="${l.id}"`;
  if (l.status === 'approved' && !l.agreement) return ['Next step', 'Generate the agreement and send it for e-signature.', btn('Send agreement for e-signature', 'agreement', id, 'pri')];
  if (l.status === 'approved') return ['Next step', 'Waiting for the customer to sign the agreement.', btn('Simulate signed callback', 'sign', id, 'pri')];
  if (l.status === 'signed') return ['Next step', 'Agreement signed. The loan activates when the order is delivered.', btn('Simulate order delivered', 'order', id + ' data-ev="delivered"', 'pri')];
  if (l.status === 'active') return ['Performing', l.nextDue ? `Next instalment LKR ${lkr0(l.nextDue.amount)} is due on ${l.nextDue.due}.` : 'All instalments are on schedule.', btn('Post payment', 'pay-modal', id, 'pri')];
  if (l.status === 'in_arrears') return ['Needs attention', `${l.dpd} days past due. Penalties are accruing.`, btn('Post payment', 'pay-modal', id, 'pri')];
  return ['Closed', `This loan is ${l.status.replace('_', ' ')}.`, ''];
}

function md(src) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of src.split('\n')) {
    let m;
    if ((m = line.match(/^(#{1,3}) (.*)/))) { close(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if ((m = line.match(/^\d+\. (.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = line.match(/^- (.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if (line.trim() === '') close();
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return out.join('');
}

  },
  release: async el => { await api('orderEvent', el.dataset.id, 'delivered', {}); toast('Delivery confirmed. Proceeds released to SINGER.'); await go('disbursements'); },
  pick: el => { document.querySelectorAll('.plan').forEach(o => o.classList.remove('sel')); el.classList.add('sel'); S.draft.tenor = +el.dataset.tenor; $('#picked').textContent = `${el.dataset.tenor}-month plan selected`; $('#submitBtn').disabled = false; },
  'submit-app': () => doSubmit(),
  decide: async el => {
    const id = el.dataset.id;
    await api('decide', id, { decision: el.dataset.d, user: 'underwriter.demo', role: val('role-' + id), note: val('note-' + id) });
    toast(el.dataset.d === 'approve' ? 'Approved. The loan is now ready for its agreement.' : 'Application declined'); await go('queue');
  },
  agreement: async el => { await api('agreement', el.dataset.id, S.lang); toast('Agreement sent to the e-signature system'); await go('loan'); },
  sign: async el => { await api('sign', el.dataset.id); toast('Signed agreement received'); await go('loan'); },
  order: async el => { await api('orderEvent', el.dataset.id, el.dataset.ev, {}); toast('Order delivered. Loan is active and proceeds go to SINGER.'); await go('loan'); },
  more: el => {
    const id = `data-id="${el.dataset.id}"`;
    modal(`<h2>More actions</h2><div class="menu">${menuItem('Settlement quote', 'Quote and close the loan early', 'settle-quote', id)}${menuItem('Partial settlement', 'Pay down principal, rebate unearned charge', 'partial-modal', id)}${menuItem('Goods return', 'Recalculate the schedule and restore the limit', 'return-modal', id)}${menuItem('Change due date', 'One-time change with approval', 'due-modal', id)}${menuItem('Cancel loan', 'Only before activation', 'cancel-loan', id)}</div><div class="row" style="margin-top:14px;justify-content:flex-end">${btn('Close', 'close')}</div>`);
  },
  'cancel-loan': async el => { closeModal(); await api('cancel', el.dataset.id); toast('Loan cancelled and credit limit released'); await go('loan'); },
  'pay-modal': el => dlg(`Post payment · ${el.dataset.id}`, `<div class="form">${field('m-amt', 'Amount (LKR)', 'number', 10000)}<div><label>Channel</label><select id="m-ch"><option>branch</option><option>card</option><option>lankaqr</option><option>bank_transfer</option></select></div></div>`, btn('Post payment', 'pay', `data-id="${el.dataset.id}"`, 'pri')),
  pay: async el => { const p = await api('pay', el.dataset.id, { amount: +val('m-amt'), channel: val('m-ch') }); closeModal(); toast('Payment applied: ' + p.allocations.slice(0, 3).map(a => `${a.comp} ${lkr0(a.amount)}`).join(', ')); await go('loan'); },
  reverse: async el => { await api('reverse', el.dataset.id, el.dataset.pay, 'ops.checker', 'Incorrectly posted'); toast('Payment reversed with approval'); await go('loan'); },
  'settle-quote': async el => {
    const q = await api('settleQuote', el.dataset.id); const b = q.breakdown;
    modal(`<h2>Settlement quote</h2><p class="muted" style="margin-top:0">Valid until ${q.validUntil}</p><table><tr><td>Due and overdue (with penalties)</td><td class="r">${lkr(b.overdueAndDue)}</td></tr><tr><td>Remaining principal</td><td class="r">${lkr(b.remainingPrincipal)}</td></tr><tr><td>Remaining fees and charges</td><td class="r">${lkr(b.remainingFees + b.remainingCharges)}</td></tr><tr><td>Unearned charge rebate</td><td class="r">− ${lkr(b.unearnedChargeRebate)}</td></tr><tr><td>Settlement discount</td><td class="r">− ${lkr(b.settlementDiscount)}</td></tr></table>
    <div class="row" style="margin-top:18px"><span class="muted">Settle today</span><span class="sp"></span><span class="big">LKR ${lkr(q.amount)}</span></div>
    <div class="row" style="margin-top:22px;justify-content:flex-end">${btn('Close', 'close')}${btn('Collect and settle', 'settle', `data-id="${el.dataset.id}" data-q="${q.id}"`, 'pri')}</div>`);
  },
  settle: async el => { await api('settle', el.dataset.id, el.dataset.q); closeModal(); toast('Loan settled and closed'); await go('loan'); },
  'partial-modal': el => dlg('Partial settlement', `<p class="muted" style="margin-top:0">Dues are cleared first. The rest reduces principal, and the unearned charge on it is rebated.</p>${field('m-amt', 'Amount (LKR)', 'number', 30000)}`, btn('Apply', 'partial', `data-id="${el.dataset.id}"`, 'pri')),
  partial: async el => { const r = await api('partial', el.dataset.id, +val('m-amt')); closeModal(); toast('Applied. Charge rebated: LKR ' + lkr0(r.chargeReduced)); await go('loan'); },
  'return-modal': el => dlg('Goods return', `<p class="muted" style="margin-top:0">The schedule is recalculated on the revised value and the credit limit is restored.</p><div class="form">${field('m-val', 'Returned value (LKR)', 'number', 50000)}${field('m-why', 'Reason', 'text', 'Faulty item')}</div>`, btn('Approve return', 'return', `data-id="${el.dataset.id}"`, 'pri')),
  return: async el => { const r = await api('returnGoods', el.dataset.id, +val('m-val'), 'ops.checker', val('m-why')); closeModal(); toast(`New instalment LKR ${lkr0(r.revisedInstalment)} · refund due LKR ${lkr0(r.refund)}`); await go('loan'); },
  'due-modal': el => dlg('Change due date', `<p class="muted" style="margin-top:0">One change per loan, with approval.</p><label>New day of month</label><select id="m-day">${S.policy.dueDay.allowedDays.map(d => `<option>${d}</option>`).join('')}</select>`, btn('Approve change', 'due', `data-id="${el.dataset.id}"`, 'pri')),
  due: async el => { await api('dueDate', el.dataset.id, +val('m-day'), 'ops.checker'); closeModal(); toast('Due date changed. Earlier schedule kept as history.'); await go('loan'); },
  waive: async el => { const w = await api('waive', el.dataset.id, +el.dataset.no, 100000, 'credit.manager', 'Goodwill'); toast(`Waived LKR ${lkr0(w)} through the approval workflow`); await go('loan'); },
  contact: el => dlg('Log contact', `<div class="form"><div><label>Outcome</label><select id="m-out"><option>Promised to pay</option><option>No answer</option><option>Disputed</option><option>Wrong number</option></select></div>${field('m-note', 'Note')}</div>`, btn('Save', 'contact-save', `data-id="${el.dataset.id}"`, 'pri')),
  'contact-save': async el => { await api('contact', el.dataset.id, { outcome: val('m-out'), note: val('m-note'), user: 'agent.demo' }); closeModal(); toast('Contact logged'); await go('collections'); },
  ptp: el => dlg('Promise to pay', `<div class="form">${field('m-date', 'Promise date', 'date', S.clock)}${field('m-amt', 'Amount (LKR)', 'number', 20000)}</div>`, btn('Save', 'ptp-save', `data-id="${el.dataset.id}"`, 'pri')),
  'ptp-save': async el => { await api('ptp', el.dataset.id, { date: val('m-date'), amount: +val('m-amt'), user: 'agent.demo' }); closeModal(); toast('Promise recorded'); await go('collections'); },
  'coll-more': el => modal(`<h2>More actions</h2><div class="menu">${menuItem('Restructure', 'Extend the remaining schedule, with approval', 'restructure', `data-id="${el.dataset.id}"`)}${menuItem('Write off', 'Uncollectable, with approval; blocks the customer', 'writeoff', `data-id="${el.dataset.id}"`)}</div><div class="row" style="margin-top:14px;justify-content:flex-end">${btn('Close', 'close')}</div>`),
  restructure: el => dlg('Restructure', `<p class="muted" style="margin-top:0">Approval required.</p>${field('m-mon', 'Extra months', 'number', 3)}`, btn('Approve', 'restructure-save', `data-id="${el.dataset.id}"`, 'pri')),
  'restructure-save': async el => { await api('restructure', el.dataset.id, +val('m-mon'), 'collections.head', 'Hardship'); closeModal(); toast('Loan restructured'); await go('collections'); },
  writeoff: el => dlg('Write off loan', `<p style="margin-top:0">Write off ${el.dataset.id}? This needs approval and blocks the customer.</p>`, btn('Approve write-off', 'writeoff-save', `data-id="${el.dataset.id}"`, 'pri')),
  'writeoff-save': async el => { await api('writeOff', el.dataset.id, 'finance.head', 'Uncollectable'); closeModal(); toast('Written off with approval'); await go('collections'); },
  limit: async el => { await api('limitAction', el.dataset.nic, el.dataset.a); toast('Credit limit ' + (el.dataset.a === 'freeze' ? 'frozen' : 'reactivated')); await go('customers'); },
  'save-policy': async () => {
    const p = S.policy;
    const patch = { graceDays: +val('p-grace'), lateFee: +val('p-late'), penalRatePerMonth: +val('p-penal') / 100, settlement: Object.assign({}, p.settlement, { discountPct: +val('p-disc') / 100 }) };
    await api('updatePolicy', patch, val('p-eff')); toast('New policy version saved'); await go('policy');
  },
  export: async el => {
    let rows;
    if (el.dataset.n === 'loan-book') rows = (await api('loans')).map(l => ({ loan: l.id, customer: l.customerName, product: l.product, status: l.status, principal: l.principal, outstanding: l.outstanding, dpd: l.dpd }));
    else rows = (await api('dashboard')).exposures;
    const out = await api('exportCsv', el.dataset.n, rows);
    if (out.saved) return toast('Saved ' + out.saved);
    modal(`<h2>${esc(out.filename)}</h2><p class="muted" style="margin-top:0">Copy these rows into Excel or save them as a .csv file.</p><pre id="csv-out">${esc(out.csv)}</pre><div class="row" style="margin-top:22px;justify-content:flex-end">${btn('Close', 'close')}${btn('Copy', 'copy-text', 'data-target="csv-out"', 'pri')}</div>`);
  }
};

document.addEventListener('click', async e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); return go(nav.dataset.nav); }
  const lang = e.target.closest('[data-lang]');
  if (lang) { S.lang = lang.dataset.lang; await refreshChrome(); if (S.view === 'apply' && W.step === 2) return go('apply'); if (S.view === 'loan') return go('loan'); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.loanTab = tab.dataset.tab; return go('loan'); }
  const atab = e.target.closest('[data-atab]');
  if (atab) { S.auditTab = atab.dataset.atab; return go('audit'); }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  const fn = ACTIONS[el.dataset.act];
  if (fn) { try { await fn(el); } catch (err) { /* already toasted */ } }
});

go('dashboard');

</script>
